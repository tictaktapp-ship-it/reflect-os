<svg width="600" height="200" viewBox="0 0 600 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="reflectionGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4DBDB6" stop-opacity="0.9" />
      <stop offset="60%" stop-color="#4DBDB6" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#4DBDB6" stop-opacity="0.2" />
    </linearGradient>
    <mask id="reflectionMask">
      <rect x="0" y="0" width="600" height="200" fill="white" />
      <ellipse cx="100" cy="165" rx="40" ry="18" fill="black" />
    </mask>
  </defs>
  
  <!-- Horizon line -->
  <line x1="20" y1="100" x2="180" y2="100" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.6" />
  
  <!-- Arc above horizon -->
  <path d="M 50 100 Q 100 40, 150 100" stroke="#ffffff" stroke-width="10" fill="none" stroke-linecap="round" />
  
  <!-- Reflection below horizon -->
  <path d="M 50 100 Q 100 160, 150 100" stroke="url(#reflectionGradient)" stroke-width="10" fill="none" stroke-linecap="round" mask="url(#reflectionMask)" />
  
  <!-- Text "Reflect" -->
  <text x="220" y="120" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="72" font-weight="700" fill="#ffffff" letter-spacing="-1.5">Reflect</text>
  
  <!-- Text "OS" -->
  <text x="475" y="120" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="72" font-weight="300" fill="#ffffff" letter-spacing="-1.5">OS</text>
</svg>